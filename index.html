<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>궁신 결투</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@500;700&family=Pixelify+Sans:wght@700&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#1a0503; --panel:rgba(32,10,8,.94); --line:#6a2a1e; --ink:#fbefe6; --dim:#c9a99a;
  --gold:#f6c560; --red:#e8382c; --mana:#a35cff; --frame:#2f5d9a;
  --fd:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fb:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--fb);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ctl{position:fixed;bottom:0;touch-action:none;padding-bottom:max(10px,env(safe-area-inset-bottom))}
/* 이동 패드 (육각 틀) */
#mv{left:0;padding-left:max(14px,env(safe-area-inset-left))}
.hex{display:flex;width:236px;height:84px;position:relative;background:linear-gradient(#3a3f4c,#1c1f27);
  clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%);padding:4px}
.hex::before{content:"";position:absolute;inset:4px;background:#121318;clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%)}
.mvb{flex:1;position:relative;background:none;border:0;padding:0;touch-action:none;display:flex;align-items:center;justify-content:center}
.mvb svg{width:44px;height:44px;transition:transform .08s}
.mvb.on svg{transform:scale(.86)}
.mvb.on path{fill:#fff}
/* 카드 */
#cards{right:0;padding-right:max(12px,env(safe-area-inset-right));display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row{display:flex;gap:6px}
.cd{width:66px;height:90px;border-radius:7px;position:relative;padding:0;touch-action:none;overflow:visible;
  background:linear-gradient(#20263a,#0e1018);border:2px solid var(--frame);box-shadow:0 0 0 1px #0a0c12,inset 0 0 12px rgba(80,140,255,.25);color:var(--ink)}
.cd::before{content:"";position:absolute;left:-6px;right:-6px;top:-9px;height:16px;
  background:linear-gradient(90deg,transparent,#c9952e 12%,#f6d07a 50%,#c9952e 88%,transparent);clip-path:polygon(0 100%,10% 20%,30% 60%,50% 0,70% 60%,90% 20%,100% 100%);pointer-events:none}
.cd .ic{position:absolute;inset:14px 10px 18px;display:flex;align-items:center;justify-content:center}
.cd .ic svg{width:38px;height:38px;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px var(--c))}
.cd .nm{position:absolute;left:0;right:0;bottom:3px;font-family:var(--fd);font-size:11px;text-align:center;color:#e8dccf}
.cd .cost{position:absolute;top:-6px;left:-7px;width:22px;height:22px;transform:rotate(45deg);background:linear-gradient(135deg,#d39bff,#6a2bd0);border:1px solid #e9c8ff;z-index:2}
.cd .cost span{display:block;transform:rotate(-45deg);font-family:var(--fd);font-size:13px;line-height:20px;text-align:center;color:#fff}
.cd .sh{position:absolute;inset:0;border-radius:5px;background:rgba(4,4,8,.72);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:34px;color:#fff;text-shadow:0 2px 0 #000}
.cd.no .ic svg{filter:grayscale(1) brightness(.55)}
.cd.ready{animation:glow 1.2s ease-in-out infinite}
.cd.tap{transform:scale(.92)}
@keyframes glow{50%{box-shadow:0 0 0 1px #0a0c12,0 0 14px rgba(120,180,255,.7),inset 0 0 14px rgba(80,140,255,.4)}}
.en{display:flex;align-items:center;gap:6px;font-family:var(--fd);font-size:16px;color:#e6ccff;text-shadow:0 1px 0 #000}
.seg{display:flex;gap:2px}.seg i{width:14px;height:10px;transform:skewX(-20deg);background:#26102f;border:1px solid #4a2560;display:block}.seg i.f{background:linear-gradient(#d39bff,#7a35e0)}
/* 오버레이 */
.ov{position:fixed;inset:0;background:rgba(14,3,2,.86);display:flex;overflow:auto;touch-action:pan-y;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.box{margin:auto;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;width:100%;max-width:780px}
h1{font-family:var(--fd);font-weight:400;font-size:clamp(30px,8vh,56px);margin:0;color:var(--gold);letter-spacing:.04em;text-shadow:0 3px 0 #5a1208,0 0 24px rgba(246,197,96,.35)}
h2{font-family:var(--fd);font-weight:400;font-size:19px;margin:0;color:var(--gold)}
p{margin:0;color:var(--dim);line-height:1.5;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.b{font-family:var(--fb);font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 16px}
.b.main{background:linear-gradient(#ffd27a,#e0a23a);border-color:#ffd27a;color:#2a1503;font-weight:700}
.b:disabled{opacity:.45}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input.code{font-family:var(--fd);font-size:28px;letter-spacing:.3em;width:160px;text-align:center;background:#200805;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:6px}
.big{font-family:var(--fd);font-size:60px;letter-spacing:.2em;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px;width:100%}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px;text-align:left;color:var(--ink);font-family:var(--fb);display:grid;grid-template-columns:30px 1fr;gap:2px 8px;align-items:center}
.pick svg{width:28px;height:28px;fill:none;stroke:var(--c,#f6c560);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;grid-row:span 3}
.pick b{font-family:var(--fd);font-weight:400;font-size:15px}
.pick small{color:var(--dim);font-size:12px;line-height:1.3}
.pick .mc{color:#d6b0ff;font-size:12px}
.pick.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pick.nb{grid-template-columns:1fr}
.box canvas{position:static;display:block;margin:0 auto}
.rot{display:none}
@media (orientation:portrait){.rot{display:flex;position:fixed;inset:0;z-index:9;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:24px;text-align:center}}
@media (max-height:430px){.cd{width:58px;height:78px}.cd .ic svg{width:30px;height:30px}.cd .ic{inset:12px 8px 16px}.hex{width:200px;height:70px}.mvb svg{width:38px;height:38px}}
@media (prefers-reduced-motion:reduce){.cd.ready{animation:none}}
[hidden]{display:none!important}
.ov.title{background:transparent}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.86;margin-bottom:4px}
.logo .l1,.logo .l2{font-family:"Pixelify Sans",var(--fd);font-weight:700;color:#fff8ee;letter-spacing:.02em;
  text-shadow:3px 0 0 #1a0608,-3px 0 0 #1a0608,0 3px 0 #1a0608,0 -3px 0 #1a0608,3px 3px 0 #1a0608,-3px 3px 0 #1a0608,3px -3px 0 #1a0608,-3px -3px 0 #1a0608,0 7px 0 #6a3a20,0 10px 0 #1a0608,0 0 26px rgba(255,220,150,.55)}
.logo .l1{font-size:clamp(44px,15vh,92px)}
.logo .l2{font-size:clamp(28px,9vh,54px);margin:2px 0}
.logo .l1 b{font-weight:400;font-size:.62em;vertical-align:.12em;color:#fff;display:inline-block;margin:0 -.02em}
.logo .l3{position:relative;padding:0 .35em}
.logo .l3::before{content:"";position:absolute;left:-.6em;right:-.6em;top:52%;height:.08em;background:linear-gradient(90deg,transparent,#fff8ee 12%,#fff8ee 88%,transparent);box-shadow:0 2px 0 #1a0608;z-index:-1}
.logo .l3::after{content:"";position:absolute;right:-.75em;top:52%;width:.32em;height:.32em;border-top:.08em solid #fff8ee;border-right:.08em solid #fff8ee;transform:translateY(-50%) rotate(45deg)}
.logo .kr{display:flex;gap:6px;margin-top:10px}
.logo .kr i{font-style:normal;font-family:var(--fd);font-size:clamp(16px,5vh,26px);color:#fff;background:#140a12;border:2px solid #3a2a34;border-radius:6px;padding:2px 8px;box-shadow:0 3px 0 #000}
.ov.title p{color:#e8d8e8;text-shadow:0 1px 3px #000;max-width:520px}
.res{margin:auto;display:grid;grid-template-columns:1fr minmax(0,1.25fr) 1fr;gap:10px;align-items:center;width:100%;max-width:860px}
.rs{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ban{font-family:var(--fd);font-size:22px;padding:6px 26px;color:#fff;background:linear-gradient(#9aa0b0,#5a606e);clip-path:polygon(6% 0,94% 0,100% 50%,94% 100%,6% 100%,0 50%);letter-spacing:.1em}
.rs.win .ban{background:linear-gradient(#ffe08a,#e08a1a);color:#5a1a06;text-shadow:0 1px 0 #fff6c8;box-shadow:0 0 18px rgba(246,197,96,.6)}
.rs.lose .rc{filter:saturate(.45) brightness(.8)}
.rc{width:min(26vw,180px);height:auto;image-rendering:pixelated;position:static!important}
.rs.win .rc{filter:drop-shadow(0 0 14px rgba(255,220,120,.55))}
.rn{font-family:var(--fd);font-size:18px;color:var(--ink)}
.rs small{color:var(--dim);font-size:12px;text-align:center}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.emb{position:relative;width:180px;height:110px;display:flex;align-items:center;justify-content:center}
.emb canvas{position:relative!important;width:180px;height:130px}
.rays{position:absolute;inset:-30px -10px;background:repeating-conic-gradient(rgba(255,230,150,.35) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.rt{font-family:var(--fd);font-size:28px;color:var(--gold);text-shadow:0 2px 0 #5a1208}
.rr{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;width:100%;max-width:330px;align-items:center;font-variant-numeric:tabular-nums}
.rr .rv{font-family:var(--fd);font-size:17px;color:var(--dim);text-align:center}
.rr .rv.hi{color:#ffe08a}
.rr .rl{font-size:12px;color:#d6b0ff;text-align:center;white-space:nowrap}
.tot{font-size:12px}
@media (prefers-reduced-motion:reduce){.rays{animation:none}}
@media (max-height:430px){.emb{height:80px}.emb canvas{width:140px;height:101px}.rt{font-size:22px}.rr .rv{font-size:15px}.ban{font-size:18px;padding:4px 20px}}

/* ===== 상단 정보줄 ===== */
#top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;
  padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 6px max(14px,env(safe-area-inset-left))}
#top>*{pointer-events:auto}
.tb-l,.goldp{display:flex;align-items:center;gap:9px;background:linear-gradient(rgba(40,14,10,.92),rgba(20,6,5,.92));border:1.5px solid #8a5a22;border-radius:22px;padding:4px 14px 4px 6px;box-shadow:0 2px 0 #000}
.tbadge{width:28px;height:28px;flex:none;transform:rotate(45deg);background:linear-gradient(135deg,#fff,var(--t) 45%,#2a1a10);border:2px solid #fff3c0;display:flex;align-items:center;justify-content:center;margin:0 4px}
.tbadge span{transform:rotate(-45deg);font-family:var(--fd);font-size:12px;color:#1a0a04}
.tb-l div{display:flex;flex-direction:column;line-height:1.05}
#tbN{font-family:var(--fd);font-weight:400;font-size:15px;color:#fff}
#tbT{font-family:var(--fd);font-size:12px}
#tbS{font-size:13px;color:#6a4a3a;letter-spacing:1px}#tbS b{color:#ffd24a;font-weight:400;text-shadow:0 0 6px rgba(255,210,74,.6)}
.tb-r{display:flex;gap:8px;align-items:center}
.goldp{padding:4px 14px 4px 8px;font-family:var(--fd);font-size:18px;color:#ffe08a;font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:16px;height:16px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c0,#f6c560 45%,#a8701a);box-shadow:inset 0 0 0 1.5px #6a420c;vertical-align:-2px}
.ib{width:36px;height:36px;border-radius:50%;background:linear-gradient(rgba(40,14,10,.92),rgba(20,6,5,.92));border:1.5px solid #8a5a22;padding:6px}
.ib svg,.sb svg,.fc svg{fill:none;stroke:#f6c560;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib svg{width:22px;height:22px}
/* ===== 메인 메뉴 ===== */
.ov.title{padding-top:max(56px,calc(env(safe-area-inset-top) + 48px))}
.ov.title .tag{font-size:13px}
.mm{display:flex;flex-direction:column;gap:9px;align-items:center;margin-top:2px}
.rk{display:flex;align-items:center;gap:12px;min-width:270px;padding:9px 28px 9px 18px;border-radius:12px;border:2px solid #ffe3a0;position:relative;overflow:hidden;
  background:linear-gradient(#ffd77e,#e09a2e 60%,#b86a12);color:#3a1a04;box-shadow:0 4px 0 #6a3a08,0 0 26px rgba(255,200,90,.35),inset 0 1px 0 #fff6d0;font-family:var(--fd);text-align:left}
.rk svg{width:36px;height:36px;fill:none;stroke:#3a1a04;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rk b{display:block;font-weight:400;font-size:26px;line-height:1}
.rk small{display:block;font-family:var(--fb);font-weight:700;font-size:12px;opacity:.75;margin-top:3px}
.rk::after{content:"";position:absolute;top:0;bottom:0;width:40px;left:-60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,62%{left:-60px}100%{left:120%}}
.rk:active,.sb:active,.fc:active,.chip:active{transform:translateY(2px)}
.sub{display:flex;gap:9px}
.sb{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:10px;background:linear-gradient(#3a1612,#1e0907);border:1.5px solid #9a6a2a;color:#fbefe6;font-family:var(--fd);font-size:17px;box-shadow:0 3px 0 #0a0302,inset 0 1px 0 rgba(255,220,160,.15)}
.sb svg{width:22px;height:22px}.sb b{font-weight:400}
.ttl{font-size:28px;text-shadow:0 2px 0 #5a1208}
.fm{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fc{width:200px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 12px;border-radius:12px;background:linear-gradient(#3a1612,#1e0907);border:1.5px solid #9a6a2a;color:#fbefe6;box-shadow:0 3px 0 #0a0302}
.fc svg{width:34px;height:34px}.fc b{font-family:var(--fd);font-weight:400;font-size:20px}.fc small{color:var(--dim);font-size:12px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:470px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:10px;background:linear-gradient(#3a1612,#1e0907);border:1.5px solid #9a6a2a;color:#fbefe6;box-shadow:0 3px 0 #0a0302}
.chip b{font-family:var(--fd);font-weight:400;font-size:20px;color:#ffe08a;display:flex;align-items:center;gap:5px}.chip small{font-size:11px;color:var(--dim)}
.chip:disabled{opacity:.35}
.betv{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fd);font-size:32px;color:#ffd86a}.betv .coin{width:24px;height:24px}
.betv.sm{font-size:20px}.betv.sm .coin{width:16px;height:16px}
.up{color:#9dff9a}.dn{color:#ff9a8a}
/* ===== 팝업 ===== */
#md{position:fixed;inset:0;z-index:8;background:rgba(10,3,2,.72);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
.mbox{position:relative;overflow:hidden;background:linear-gradient(#2c0f0a,#140504);border:2px solid #c9952e;border-radius:14px;padding:16px 20px;max-width:420px;width:100%;margin:auto;
  text-align:center;display:flex;flex-direction:column;gap:9px;box-shadow:0 0 34px rgba(246,197,96,.25)}
.mbox>.b{width:100%}.mbox .btns .b{flex:1}
.mbox h1{font-size:40px}.mbox .lab{text-align:left;color:var(--gold);font-family:var(--fd)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pk{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 4px}
.pk b{font-family:var(--fd);font-weight:400;font-size:16px}.pk small{display:block;font-size:11px;color:var(--dim)}
.pk.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.prays{position:absolute;left:50%;top:60px;width:360px;height:360px;margin:-180px 0 0 -180px;background:repeating-conic-gradient(rgba(255,230,150,.22) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 15%,transparent 65%);mask:radial-gradient(circle,#000 15%,transparent 65%);animation:spin 14s linear infinite;pointer-events:none}
.pbadge{position:relative;width:66px;height:66px;margin:10px auto 6px;transform:rotate(45deg);background:linear-gradient(135deg,#fff,var(--t) 45%,#2a1a10);border:3px solid #fff3c0;box-shadow:0 0 30px var(--t);display:flex;align-items:center;justify-content:center;animation:pop .55s ease-out}
.pbadge span{transform:rotate(-45deg);font-family:var(--fd);font-size:24px;color:#1a0a04}
.ptier{font-family:var(--fd);font-size:26px}
@keyframes pop{0%{transform:rotate(45deg) scale(.2)}70%{transform:rotate(45deg) scale(1.15)}100%{transform:rotate(45deg) scale(1)}}
#toast{position:fixed;top:max(60px,calc(env(safe-area-inset-top) + 52px));left:50%;transform:translateX(-50%);z-index:10;background:rgba(20,8,6,.95);border:1px solid #c9952e;color:#ffe9a0;padding:8px 16px;border-radius:8px;font-family:var(--fd);font-size:16px;pointer-events:none}
/* ===== 결과 보상 ===== */
.rw{display:flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap;padding:6px 18px;border-radius:10px;background:rgba(0,0,0,.42);border:1px solid #7a5a2a;font-family:var(--fd)}
.rwg{font-size:28px;color:#ffd86a;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #3a1a04}.rwg.neg{color:#ff8a7a}
.rws{font-size:20px;color:#ffe9a0;white-space:nowrap}
.rwj{font-size:16px;color:#2a1003;background:linear-gradient(#fff3b0,#f6b53a);border-radius:6px;padding:2px 9px}
.rwj.on{animation:jp .7s ease-out}
@keyframes jp{0%{transform:scale(2.6);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.rw.gold{box-shadow:0 0 24px rgba(255,210,90,.7);border-color:#ffd86a}
.rwn{font-size:12px;color:#e6ccff}
@media (max-height:430px){.logo .l1{font-size:clamp(36px,12vh,92px)}.logo .l2{font-size:clamp(22px,7vh,54px)}.logo .kr{margin-top:6px}.ov.title .tag{display:none}.rk{padding:7px 24px 7px 16px}.rk b{font-size:22px}.rwg{font-size:22px}.rw{padding:4px 14px}}
@media (prefers-reduced-motion:reduce){.rk::after,.prays{animation:none}}

.tpb{display:inline-block;width:64px;height:7px;border-radius:4px;background:#2a120c;border:1px solid #6a4a2a;overflow:hidden;vertical-align:middle}
.tpb i{display:block;height:100%;background:linear-gradient(90deg,#c9952e,#ffe08a)}
#tbS em{font-style:normal;font-family:var(--fd);font-size:13px;color:#ffe08a;margin:0 8px 0 5px}

  ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=1.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  switch(k){case 'guard':ctx.moveTo(0,-6);ctx.lineTo(5,-4);ctx.lineTo(4,2);ctx.lineTo(0,6);ctx.lineTo(-4,2);ctx.lineTo(-5,-4);ctx.closePath();ctx.stroke();break;
    case 'rapid':ctx.moveTo(-5,-3);ctx.lineTo(3,-3);ctx.moveTo(-5,3);ctx.lineTo(3,3);ctx.moveTo(1,-6);ctx.lineTo(5,-3);ctx.lineTo(1,0);ctx.moveTo(1,0);ctx.lineTo(5,3);ctx.lineTo(1,6);ctx.stroke();break;

    case 'slow':for(let i=0;i<3;i++){const a=i*Math.PI/3;ctx.moveTo(Math.cos(a)*6,Math.sin(a)*6);ctx.lineTo(-Math.cos(a)*6,-Math.sin(a)*6)}ctx.stroke();break;
    case 'root':ctx.moveTo(-5,-5);ctx.lineTo(5,5);ctx.moveTo(5,-5);ctx.lineTo(-5,5);ctx.moveTo(-5,0);ctx.lineTo(5,0);ctx.moveTo(0,-5);ctx.lineTo(0,5);ctx.stroke();break;

  ctx.restore()}

const thv=q=>(q.dmg||0)+(q.stun?260:0)+(q.burn?90:0)+(['net','ice','poison'].includes(q.k)?130:0)+(q.k==='bomb'?200:0)+(q.k==='flamearw'?120:0)+(q.k==='mine'?60:0);
function aiCost(p,pl,Hh){const [a,b]=PODS[1],sp=SPD*spdM(p),st=1/30,hitP=new Set(),hitM=new Set(),booms=[];
  let x=p.x,y=p.y,vy=pl.vy??(p.air?p.vy:0),vx=pl.vx??(p.air?p.vx||0:0),air=pl.vy?true:p.air,c=pl.c||0;
  for(const m of S.mines)if(m.o===0&&m._ai!==0){if(m.trig)booms.push({t:m.trig,x:m.x,r:m.r||90,d:m.dmg||140});else if(m.k==='bomb')booms.push({t:m.t,x:m.x,r:m.r||125,d:m.dmg||200})}

    if(air){vy+=G*st;y+=vy*st;x+=vx*st;if(y>=GY&&vy>0){y=GY;air=false;vx=0}}else if(pl.dir&&t<=pl.dur&&!(p.rootT>t))x+=pl.dir*sp*st;
    x=Math.max(a+22,Math.min(b-22,x));const inv=(pl.inv||0)>t||p.inv>t||p.guard>t;
    for(const q of S.pr){if(q.o!==0||q._ai===0||hitP.has(q))continue;const qx=q.x+q.vx*t,qy=q.y+q.vy*t+.5*q.g*t*t;
      if(qy>=GY&&inPod(qx)){hitP.add(q);continue}
      if(Math.abs(qx-x)<16+q.r&&qy>y-104-q.r&&qy<y+q.r){hitP.add(q);if(!inv)c+=thv(q)}}

      if(m.k==='bolt'||m.k==='meteor'){if(!hitM.has(m)&&t>=m.warm){hitM.add(m);if(inA&&!inv&&(m.k==='bolt'||y>GY-120))c+=m.k==='bolt'?(m.dmg||280):(m.dmg||70)}}

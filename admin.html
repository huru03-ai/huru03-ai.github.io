<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>궁신결투 관리자</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#1a0503;--panel:#2a0f0a;--line:#6a2a1e;--ink:#fbefe6;--dim:#c9a99a;--gold:#f6c560;--on:#5aff8a;--fd:"Do Hyeon",sans-serif;--fb:"Gothic A1",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);padding:16px}
h1{font-family:var(--fd);font-weight:400;color:var(--gold);margin:0 0 12px;font-size:28px}
.box{max-width:340px;margin:60px auto;background:var(--panel);border:2px solid #c9952e;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
input,select{font:inherit;font-size:16px;background:#200805;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px}
button{font:inherit;font-size:15px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;cursor:pointer}
button.main{background:linear-gradient(#ffd27a,#e0a23a);color:#2a1503;border-color:#ffd27a;font-weight:700}
.msg{color:#ffe08a;font-size:13px;min-height:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:140px}
.st small{display:block;color:var(--dim);font-size:12px}.st b{font-family:var(--fd);font-weight:400;font-size:28px}
.st.on b{color:var(--on)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th,td{padding:8px 6px;border-bottom:1px solid #3a1a12;text-align:left;white-space:nowrap}
th{color:var(--gold);font-weight:700;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#555}.dot.on{background:var(--on);box-shadow:0 0 8px var(--on)}
tr.online td{background:rgba(90,255,138,.06)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.t0{color:#c8d2dc}.t1{color:#8fe07a}.t2{color:#5ab4ff}.t3{color:#c88aff}.t4{color:#ffd24a}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="box" id="login">
  <h1>관리자 로그인</h1>
  <input id="nk" placeholder="관리자 닉네임" autocomplete="off">
  <input id="pw" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리">
  <div class="msg" id="lm"></div>
  <button class="main" id="go">들어가기</button>
</div>
<div id="app" hidden>
  <h1>궁신결투 관리자</h1>
  <div class="stats">
    <div class="st on"><small>지금 접속 중</small><b id="sOn">0</b></div>
    <div class="st"><small>전체 가입자</small><b id="sAll">0</b></div>
    <div class="st"><small>모두의 플레이 시간</small><b id="sPt">0</b></div>
  </div>
  <div class="bar">
    <input id="q" placeholder="닉네임 검색">
    <select id="sort"><option value="upd">최근 접속 순</option><option value="ps">플레이 시간 순</option><option value="tier">계급 순</option><option value="gold">골드 순</option><option value="games">판 수 순</option></select>
    <button id="rf">새로고침</button><button id="lo">로그아웃</button>
    <span class="msg" id="am"></span>
  </div>
  <div class="wrap"><table><thead><tr><th></th><th>닉네임</th><th>계급</th><th class="num">골드</th><th class="num">승 / 판</th><th class="num">플레이 시간</th><th>마지막 접속</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<script>
(()=>{
const FBC={apiKey:"AIzaSyBhKsybYzz0d3mBrNMwatPI0sjgQgn11tU",authDomain:"gungsin-duel.firebaseapp.com",projectId:"gungsin-duel",storageBucket:"gungsin-duel.firebasestorage.app",messagingSenderId:"203196099141",appId:"1:203196099141:web:9282e95e1602d1e967912c",databaseURL:"https://gungsin-duel-default-rtdb.asia-southeast1.firebasedatabase.app"};
const TIERS=['수습 궁수','사냥꾼','명사수','궁신','천상 궁신'],ROMAN=['I','II','III','IV','V'];
const $=id=>document.getElementById(id);
const nickMail=n=>'n'+[...new TextEncoder().encode(n.toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('')+'@gungsin.game',pinPw=p=>'gs-'+p+'-duel';
firebase.initializeApp(FBC);const auth=firebase.auth(),fs=firebase.firestore();try{fs.settings({experimentalForceLongPolling:true,merge:true})}catch(e){}
let users=[],online={};
const hm=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}시간 ${m}분`:`${m}분`};
const ago=d=>{if(!d)return '-';const m=Math.floor((Date.now()-d)/60000);if(m<1)return '방금';if(m<60)return m+'분 전';const h=Math.floor(m/60);if(h<24)return h+'시간 전';return Math.floor(h/24)+'일 전'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){const q=$('q').value.trim().toLowerCase(),k=$('sort').value;
  let L=users.filter(u=>!q||(u.nick||'').toLowerCase().includes(q));
  const key={upd:u=>u.updMs||0,ps:u=>u.ps||0,tier:u=>(u.tier||0)*1000+(u.div||0)*100+(u.pts||0),gold:u=>u.gold||0,games:u=>u.games||0}[k];
  L.sort((a,b)=>(online[b.id]?1:0)-(online[a.id]?1:0)||key(b)-key(a));
  $('tb').innerHTML=L.map(u=>{const on=!!online[u.id],t=u.tier||0;return `<tr class="${on?'online':''}"><td><span class="dot${on?' on':''}"></span></td><td>${esc(u.nick)}</td><td class="t${t}">${TIERS[t]} ${ROMAN[u.div||0]}</td>
    <td class="num">${(u.gold||0).toLocaleString()}</td><td class="num">${u.wins||0} / ${u.games||0}</td><td class="num">${hm(u.ps)}</td><td>${on?'접속 중':ago(u.updMs)}</td></tr>`}).join('')||'<tr><td colspan="7">플레이어가 없어요</td></tr>';
  $('sOn').textContent=Object.keys(online).length;$('sAll').textContent=users.length;$('sPt').textContent=hm(users.reduce((a,u)=>a+(u.ps||0),0))}
async function load(){$('am').textContent='불러오는 중…';
  try{const r=await fs.collection('users').get();users=r.docs.map(d=>{const v=d.data();return {id:d.id,nick:v.nick,tier:v.tier,div:v.div,pts:v.pts,gold:v.gold,wins:v.wins,games:v.games,ps:v.ps,updMs:v.upd&&v.upd.toMillis?v.upd.toMillis():0}});$('am').textContent='';draw()}
  catch(e){$('am').textContent='목록을 못 불러왔어요: '+(e.code||e.message)+' (Firestore 규칙을 확인해 주세요)'}}
function liveOnline(){firebase.database().ref('status').on('value',s=>{online=s.val()||{};draw()},e=>{$('am').textContent='접속자 수를 못 불러왔어요: '+(e.code||e.message)+' (Realtime Database 규칙을 확인해 주세요)'})}
function start(){$('login').hidden=true;$('app').hidden=false;load();liveOnline()}
auth.onAuthStateChanged(u=>{if(u)start()});
$('go').onclick=async()=>{const n=$('nk').value.trim(),p=$('pw').value.trim();if(!n||!/^\d{4}$/.test(p)){$('lm').textContent='닉네임과 숫자 4자리를 넣어 주세요';return}
  $('lm').textContent='잠시만요…';try{await auth.signInWithEmailAndPassword(nickMail(n),pinPw(p))}catch(e){$('lm').textContent='로그인 실패: 닉네임이나 비밀번호를 확인해 주세요'}};
$('q').oninput=draw;$('sort').onchange=draw;$('rf').onclick=load;
$('lo').onclick=async()=>{await auth.signOut();location.reload()};
setInterval(()=>{if(!$('app').hidden)draw()},60000);
})();
</script>
</body>
</html>
